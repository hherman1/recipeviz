<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 416"><rect width="667" height="416" fill="#fff"/><g fill="none" stroke="#159447" stroke-width="2" shape-rendering="crispEdges"><rect x="1" y="1" width="665" height="414"/><line x1="0" y1="36" x2="667" y2="36"/><line x1="0" y1="72" x2="667" y2="72"/><rect x="0" y="72" width="318" height="36"/><rect x="318" y="72" width="64" height="36"/><line x1="0" y1="108" x2="318" y2="108"/><rect x="0" y="108" width="318" height="36"/><rect x="0" y="144" width="318" height="36"/><rect x="0" y="180" width="318" height="56"/><rect x="382" y="72" width="64" height="164"/><line x1="0" y1="236" x2="382" y2="236"/><rect x="0" y="236" width="318" height="36"/><rect x="446" y="72" width="64" height="200"/><line x1="0" y1="272" x2="446" y2="272"/><rect x="0" y="272" width="318" height="36"/><rect x="0" y="308" width="318" height="36"/><rect x="0" y="344" width="318" height="36"/><rect x="0" y="380" width="318" height="36"/><rect x="510" y="72" width="64" height="344"/><line x1="0" y1="416" x2="510" y2="416"/><rect x="574" y="72" width="93" height="344"/></g><g fill="#111" font-family="Arial, sans-serif" font-size="22"><text x="333" y="18" text-anchor="middle" dominant-baseline="middle"><tspan x="333">Butter and flour an 8x8 in pan</tspan></text><text x="333" y="54" text-anchor="middle" dominant-baseline="middle"><tspan x="333">Preheat oven to 350*flour</tspan></text><text x="8" y="90" text-anchor="start" dominant-baseline="middle"><tspan x="8">4oz (115 g) unsalted butter</tspan></text><text x="350" y="90" text-anchor="middle" dominant-baseline="middle"><tspan x="350">melt</tspan></text><text x="8" y="126" text-anchor="start" dominant-baseline="middle"><tspan x="8">1 cup (200g g) sugar</tspan></text><text x="8" y="162" text-anchor="start" dominant-baseline="middle"><tspan x="8">1/4 tsp vanilla extract</tspan></text><text x="8" y="196" text-anchor="start" dominant-baseline="middle"><tspan x="8">1 shot espresso very very</tspan><tspan x="8" dy="24">strong coffee</tspan></text><text x="414" y="154" text-anchor="middle" dominant-baseline="middle"><tspan x="414">mix</tspan></text><text x="8" y="254" text-anchor="start" dominant-baseline="middle"><tspan x="8">2 large eggs</tspan></text><text x="478" y="172" text-anchor="middle" dominant-baseline="middle"><tspan x="478">mix</tspan></text><text x="8" y="290" text-anchor="start" dominant-baseline="middle"><tspan x="8">1/2 cup all purpose flour</tspan></text><text x="8" y="326" text-anchor="start" dominant-baseline="middle"><tspan x="8">1/3 cup (80g) cocoa powder</tspan></text><text x="8" y="362" text-anchor="start" dominant-baseline="middle"><tspan x="8">1/4 tsp baking soda</tspan></text><text x="8" y="398" text-anchor="start" dominant-baseline="middle"><tspan x="8">1/4 tsp table salt</tspan></text><text x="542" y="232" text-anchor="middle" dominant-baseline="middle"><tspan x="542">fold</tspan><tspan x="542" dy="24">in</tspan></text><text x="620" y="208" text-anchor="middle" dominant-baseline="middle"><tspan x="620">bake</tspan><tspan x="620" dy="24">350*</tspan><tspan x="620" dy="24">30-40</tspan><tspan x="620" dy="24">minutes</tspan></text></g></svg>