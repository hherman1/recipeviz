<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 420"><rect width="667" height="420" fill="#fff"/><g fill="none" stroke="#159447" stroke-width="2" shape-rendering="crispEdges"><rect x="1" y="1" width="665" height="418"/><line x1="0" y1="36" x2="667" y2="36"/><line x1="0" y1="72" x2="667" y2="72"/><rect x="0" y="72" width="318" height="36"/><rect x="318" y="72" width="64" height="36"/><line x1="0" y1="108" x2="318" y2="108"/><rect x="0" y="108" width="318" height="36"/><rect x="0" y="144" width="318" height="36"/><rect x="0" y="180" width="318" height="60"/><rect x="382" y="72" width="64" height="168"/><line x1="0" y1="240" x2="382" y2="240"/><rect x="0" y="240" width="318" height="36"/><rect x="446" y="72" width="64" height="204"/><line x1="0" y1="276" x2="446" y2="276"/><rect x="0" y="276" width="318" height="36"/><rect x="0" y="312" width="318" height="36"/><rect x="0" y="348" width="318" height="36"/><rect x="0" y="384" width="318" height="36"/><rect x="510" y="72" width="64" height="348"/><line x1="0" y1="420" x2="510" y2="420"/><rect x="574" y="72" width="93" height="348"/></g><g fill="#111" font-family="Arial, sans-serif" font-size="22"><text x="333" y="24" text-anchor="middle"><tspan x="333">Butter and flour an 8x8 in pan</tspan></text><text x="333" y="60" text-anchor="middle"><tspan x="333">Preheat oven to 350*flour</tspan></text><text x="8" y="96" text-anchor="start"><tspan x="8">4oz (115 g) unsalted butter</tspan></text><text x="350" y="96" text-anchor="middle"><tspan x="350">melt</tspan></text><text x="8" y="132" text-anchor="start"><tspan x="8">1 cup (200g g) sugar</tspan></text><text x="8" y="168" text-anchor="start"><tspan x="8">1/4 tsp vanilla extract</tspan></text><text x="8" y="204" text-anchor="start"><tspan x="8">1 shot espresso very very</tspan><tspan x="8" dy="24">strong coffee</tspan></text><text x="414" y="162" text-anchor="middle"><tspan x="414">mix</tspan></text><text x="8" y="264" text-anchor="start"><tspan x="8">2 large eggs</tspan></text><text x="478" y="180" text-anchor="middle"><tspan x="478">mix</tspan></text><text x="8" y="300" text-anchor="start"><tspan x="8">1/2 cup all purpose flour</tspan></text><text x="8" y="336" text-anchor="start"><tspan x="8">1/3 cup (80g) cocoa powder</tspan></text><text x="8" y="372" text-anchor="start"><tspan x="8">1/4 tsp baking soda</tspan></text><text x="8" y="408" text-anchor="start"><tspan x="8">1/4 tsp table salt</tspan></text><text x="542" y="240" text-anchor="middle"><tspan x="542">fold</tspan><tspan x="542" dy="24">in</tspan></text><text x="620" y="216" text-anchor="middle"><tspan x="620">bake</tspan><tspan x="620" dy="24">350*</tspan><tspan x="620" dy="24">30-40</tspan><tspan x="620" dy="24">minutes</tspan></text></g></svg>