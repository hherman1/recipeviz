<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recipeviz playground</title>
  <style>
    :root {
      color: #17231b;
      background: #f4f7f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      margin: 0;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #cbd7cd;
      background: #fff;
    }

    h1 {
      margin: 0;
      color: #0d7d30;
      font-size: 1.25rem;
    }

    header span {
      color: #647168;
      font-size: 0.9rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(20rem, 1fr) minmax(20rem, 1fr);
      min-height: 0;
    }

    section {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      padding: 1rem;
    }

    section + section {
      border-left: 1px solid #cbd7cd;
    }

    label,
    .panel-title {
      margin-bottom: 0.55rem;
      color: #415048;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.55rem;
    }

    .panel-header .panel-title {
      margin-bottom: 0;
    }

    button {
      padding: 0.4rem 0.7rem;
      border: 1px solid #0d7d30;
      border-radius: 0.35rem;
      background: #159447;
      color: #fff;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0d7d30;
    }

    button:focus-visible {
      outline: 3px solid rgb(21 148 71 / 25%);
      outline-offset: 2px;
    }

    button:disabled {
      border-color: #aab5ac;
      background: #c5cdc7;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 22rem;
      padding: 0.9rem;
      resize: none;
      border: 1px solid #b8c7bb;
      border-radius: 0.45rem;
      outline: none;
      background: #fff;
      color: #17231b;
      font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    textarea:focus {
      border-color: #159447;
      box-shadow: 0 0 0 3px rgb(21 148 71 / 14%);
    }

    .result {
      min-height: 22rem;
      overflow: auto;
      border: 1px solid #b8c7bb;
      border-radius: 0.45rem;
      background: #fff;
    }

    #output {
      display: block;
      width: 100%;
      height: auto;
      padding: 0.75rem;
      user-select: none;
    }

    #status,
    #error {
      margin: 1rem;
      padding: 0.8rem 0.9rem;
      border-radius: 0.35rem;
      white-space: pre-wrap;
    }

    #status {
      color: #647168;
      background: #eef3ef;
    }

    #error {
      color: #8d1c1c;
      background: #fff0f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      section + section {
        border-top: 1px solid #cbd7cd;
        border-left: 0;
      }

      textarea {
        resize: vertical;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>recipeviz</h1>
    <span>Edit the recipe to redraw its dependency forest.</span>
  </header>
  <main>
    <section>
      <label for="source">Recipe</label>
      <textarea id="source" spellcheck="false">Butter and flour an 8x8 in pan
Preheat oven to 350*flour
UBR: 4oz (115 g) unsalted butter
melt UBR
SG: 1 cup (200g g) sugar
V: 1/4 tsp vanilla extract
COFFEE: 1 shot espresso very very strong coffee
MIX1: mix UBR SG V COFFEE
EGG: 2 large eggs
MIX2: mix MIX1 EGG
FLW: 1/2 cup all purpose flour
COCOA: 1/3 cup (80g) cocoa powder
BSO: 1/4 tsp baking soda
SALT: 1/4 tsp table salt
FOLD: fold in MIX2 FLW COCOA BSO SALT
bake 350* 30-40 minutes FOLD</textarea>
    </section>
    <section>
      <div class="panel-header">
        <div class="panel-title">SVG</div>
        <button id="download" type="button" disabled>Download SVG</button>
      </div>
      <div class="result" aria-live="polite">
        <div id="status">Loading renderer…</div>
        <div id="error" role="alert" hidden></div>
        <img id="output" alt="Rendered recipe dependency diagram" hidden>
      </div>
    </section>
  </main>
  <script src="wasm_exec.js"></script>
  <script type="module">
    const source = document.querySelector("#source");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const output = document.querySelector("#output");
    const download = document.querySelector("#download");
    let currentImageURL = "";
    let shareRevision = 0;

    async function encodeRecipe(value) {
      const compressed = new Uint8Array(await new Response(
        new Blob([value]).stream().pipeThrough(new CompressionStream("gzip")),
      ).arrayBuffer());
      let binary = "";
      for (let offset = 0; offset < compressed.length; offset += 0x8000) {
        binary += String.fromCharCode(...compressed.subarray(offset, offset + 0x8000));
      }
      return btoa(binary).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
    }

    async function decodeRecipe(value) {
      const base64 = value.replaceAll("-", "+").replaceAll("_", "/");
      const binary = atob(base64 + "=".repeat((4 - base64.length % 4) % 4));
      const compressed = Uint8Array.from(binary, character => character.charCodeAt(0));
      const decompressed = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(decompressed).text();
    }

    async function updateShareURL() {
      const revision = ++shareRevision;
      try {
        const encoded = await encodeRecipe(source.value);
        if (revision !== shareRevision) {
          return;
        }
        const url = new URL(location.href);
        url.searchParams.set("recipe", encoded);
        history.replaceState(null, "", url);
      } catch (cause) {
        console.error("Could not update the share URL", cause);
      }
    }

    function showError(message) {
      if (currentImageURL) {
        URL.revokeObjectURL(currentImageURL);
        currentImageURL = "";
        output.removeAttribute("src");
      }
      download.disabled = true;
      status.hidden = true;
      output.hidden = true;
      error.textContent = message;
      error.hidden = false;
    }

    function render() {
      try {
        const result = globalThis.recipevizRender(source.value);
        if (result.error) {
          showError(result.error);
          return;
        }
        error.hidden = true;
        status.hidden = true;
        const nextImageURL = URL.createObjectURL(new Blob([result.svg], { type: "image/svg+xml;charset=utf-8" }));
        if (currentImageURL) {
          URL.revokeObjectURL(currentImageURL);
        }
        currentImageURL = nextImageURL;
        download.disabled = false;
        output.src = currentImageURL;
        output.hidden = false;
      } catch (cause) {
        showError(cause instanceof Error ? cause.message : String(cause));
      }
    }

    download.addEventListener("click", () => {
      if (!currentImageURL) {
        return;
      }
      const link = document.createElement("a");
      link.href = currentImageURL;
      link.download = "recipe.svg";
      document.body.append(link);
      link.click();
      link.remove();
    });

    let sharedRecipeError = "";
    const sharedRecipe = new URL(location.href).searchParams.get("recipe");
    if (sharedRecipe !== null) {
      try {
        source.value = await decodeRecipe(sharedRecipe);
      } catch (cause) {
        sharedRecipeError = `Invalid shared recipe: ${cause instanceof Error ? cause.message : String(cause)}`;
      }
    }

    try {
      const go = new Go();
      const response = await fetch("recipeviz.wasm");
      if (!response.ok) {
        throw new Error(`Loading recipeviz.wasm failed: ${response.status} ${response.statusText}`);
      }
      const { instance } = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
      void go.run(instance);
      for (let attempt = 0; typeof globalThis.recipevizRender !== "function" && attempt < 100; attempt++) {
        await new Promise(resolve => requestAnimationFrame(resolve));
      }
      if (typeof globalThis.recipevizRender !== "function") {
        throw new Error("The WebAssembly renderer did not start.");
      }
      source.addEventListener("input", () => {
        render();
        void updateShareURL();
      });
      if (sharedRecipeError) {
        showError(sharedRecipeError);
      } else {
        render();
      }
      source.focus();
    } catch (cause) {
      showError(cause instanceof Error ? cause.message : String(cause));
    }
  </script>
</body>
</html>
