<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 997 588"><rect width="997" height="588" fill="#fff"/><g fill="none" stroke="#159447" stroke-width="2" shape-rendering="crispEdges"><rect x="1" y="1" width="995" height="586"/><line x1="0" y1="444" x2="997" y2="444"/><line x1="0" y1="480" x2="997" y2="480"/><line x1="0" y1="516" x2="997" y2="516"/><line x1="0" y1="552" x2="997" y2="552"/><rect x="0" y="0" width="247" height="132"/><rect x="247" y="0" width="137" height="132"/><line x1="0" y1="132" x2="247" y2="132"/><rect x="0" y="132" width="247" height="60"/><rect x="0" y="192" width="247" height="60"/><rect x="247" y="132" width="137" height="120"/><line x1="0" y1="252" x2="247" y2="252"/><rect x="384" y="132" width="148" height="120"/><line x1="0" y1="252" x2="384" y2="252"/><rect x="532" y="132" width="93" height="120"/><line x1="0" y1="252" x2="532" y2="252"/><rect x="625" y="0" width="115" height="252"/><line x1="0" y1="252" x2="625" y2="252"/><rect x="740" y="0" width="82" height="252"/><line x1="0" y1="252" x2="740" y2="252"/><rect x="0" y="252" width="247" height="132"/><rect x="247" y="252" width="137" height="132"/><line x1="0" y1="384" x2="247" y2="384"/><rect x="384" y="252" width="148" height="132"/><line x1="0" y1="384" x2="384" y2="384"/><rect x="822" y="0" width="104" height="384"/><line x1="0" y1="384" x2="822" y2="384"/><rect x="0" y="384" width="247" height="60"/><rect x="926" y="0" width="71" height="444"/></g><g fill="#111" font-family="Arial, sans-serif" font-size="22"><text x="8" y="36" text-anchor="start"><tspan x="8">60-100 ml fresh</tspan><tspan x="8" dy="24">yogurt starter,</tspan><tspan x="8" dy="24">sweetened or</tspan><tspan x="8" dy="24">unsweetened</tspan></text><text x="315" y="24" text-anchor="middle"><tspan x="315">bring fully</tspan><tspan x="315" dy="24">to room</tspan><tspan x="315" dy="24">temperature</tspan><tspan x="315" dy="24">for 1-2</tspan><tspan x="315" dy="24">hours</tspan></text><text x="8" y="156" text-anchor="start"><tspan x="8">840 ml unsweetened</tspan><tspan x="8" dy="24">milk</tspan></text><text x="8" y="216" text-anchor="start"><tspan x="8">160 ml sweetened</tspan><tspan x="8" dy="24">condensed milk</tspan></text><text x="315" y="186" text-anchor="middle"><tspan x="315">stir</tspan><tspan x="315" dy="24">together</tspan></text><text x="458" y="162" text-anchor="middle"><tspan x="458">heat to</tspan><tspan x="458" dy="24">80-85°C,</tspan><tspan x="458" dy="24">stirring</tspan><tspan x="458" dy="24">continuously</tspan></text><text x="578" y="186" text-anchor="middle"><tspan x="578">cool to</tspan><tspan x="578" dy="24">40-43°C</tspan></text><text x="682" y="24" text-anchor="middle"><tspan x="682">gently</tspan><tspan x="682" dy="24">temper</tspan><tspan x="682" dy="24">starter</tspan><tspan x="682" dy="24">with 2-3</tspan><tspan x="682" dy="24">tbsp</tspan><tspan x="682" dy="24">milk,</tspan><tspan x="682" dy="24">then fold</tspan><tspan x="682" dy="24">into the</tspan><tspan x="682" dy="24">remaining</tspan><tspan x="682" dy="24">milk</tspan></text><text x="781" y="108" text-anchor="middle"><tspan x="781">strain</tspan><tspan x="781" dy="24">if</tspan><tspan x="781" dy="24">needed</tspan></text><text x="8" y="312" text-anchor="start"><tspan x="8">8 125 ml jars and</tspan><tspan x="8" dy="24">utensils</tspan></text><text x="315" y="288" text-anchor="middle"><tspan x="315">sterilize</tspan><tspan x="315" dy="24">in boiling</tspan><tspan x="315" dy="24">water for</tspan><tspan x="315" dy="24">30 seconds</tspan></text><text x="458" y="276" text-anchor="middle"><tspan x="458">dry at 100°C</tspan><tspan x="458" dy="24">for 2-3</tspan><tspan x="458" dy="24">minutes or</tspan><tspan x="458" dy="24">air-dry</tspan><tspan x="458" dy="24">completely</tspan></text><text x="874" y="126" text-anchor="middle"><tspan x="874">divide</tspan><tspan x="874" dy="24">among</tspan><tspan x="874" dy="24">jars,</tspan><tspan x="874" dy="24">skim</tspan><tspan x="874" dy="24">bubbles,</tspan><tspan x="874" dy="24">and</tspan><tspan x="874" dy="24">cover</tspan></text><text x="8" y="408" text-anchor="start"><tspan x="8">heat oven to 70-80°C</tspan><tspan x="8" dy="24">for 5 minutes</tspan></text><text x="961" y="144" text-anchor="middle"><tspan x="961">place</tspan><tspan x="961" dy="24">jars</tspan><tspan x="961" dy="24">in</tspan><tspan x="961" dy="24">oven,</tspan><tspan x="961" dy="24">then</tspan><tspan x="961" dy="24">turn</tspan><tspan x="961" dy="24">oven</tspan><tspan x="961" dy="24">off</tspan></text><text x="498" y="468" text-anchor="middle"><tspan x="498">after 1-1.5 hours, heat oven to 50-60°C for 2-3 minutes</tspan></text><text x="498" y="504" text-anchor="middle"><tspan x="498">after another 1-1.5 hours, heat oven to 50-60°C for 1-2 minutes</tspan></text><text x="498" y="540" text-anchor="middle"><tspan x="498">incubate without opening the oven or moving the jars until set and tangy, 4-5 hours total</tspan></text><text x="498" y="576" text-anchor="middle"><tspan x="498">refrigerate when set and sufficiently tart</tspan></text></g></svg>