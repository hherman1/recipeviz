<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recipeviz playground</title>
  <style>
    :root {
      color: #17231b;
      background: #f4f7f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      margin: 0;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #cbd7cd;
      background: #fff;
    }

    h1 {
      margin: 0;
      color: #0d7d30;
      font-size: 1.25rem;
    }

    header span {
      color: #647168;
      font-size: 0.9rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(20rem, 1fr) minmax(20rem, 1fr);
      min-height: 0;
    }

    section {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      padding: 1rem;
    }

    section + section {
      border-left: 1px solid #cbd7cd;
    }

    label,
    .panel-title {
      margin-bottom: 0.55rem;
      color: #415048;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 22rem;
      padding: 0.9rem;
      resize: none;
      border: 1px solid #b8c7bb;
      border-radius: 0.45rem;
      outline: none;
      background: #fff;
      color: #17231b;
      font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    textarea:focus {
      border-color: #159447;
      box-shadow: 0 0 0 3px rgb(21 148 71 / 14%);
    }

    .result {
      min-height: 22rem;
      overflow: auto;
      border: 1px solid #b8c7bb;
      border-radius: 0.45rem;
      background: #fff;
    }

    #output {
      min-width: min-content;
      padding: 0.75rem;
    }

    #output svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #status,
    #error {
      margin: 1rem;
      padding: 0.8rem 0.9rem;
      border-radius: 0.35rem;
      white-space: pre-wrap;
    }

    #status {
      color: #647168;
      background: #eef3ef;
    }

    #error {
      color: #8d1c1c;
      background: #fff0f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      section + section {
        border-top: 1px solid #cbd7cd;
        border-left: 0;
      }

      textarea {
        resize: vertical;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>recipeviz</h1>
    <span>Edit the recipe to redraw its dependency forest.</span>
  </header>
  <main>
    <section>
      <label for="source">Recipe</label>
      <textarea id="source" spellcheck="false">Butter and flour an 8x8 in pan
Preheat oven to 350*flour
UBR: 4oz (115 g) unsalted butter
melt UBR
SG: 1 cup (200g g) sugar
V: 1/4 tsp vanilla extract
COFFEE: 1 shot espresso very very strong coffee
MIX1: mix UBR SG V COFFEE
EGG: 2 large eggs
MIX2: mix MIX1 EGG
FLW: 1/2 cup all purpose flour
COCOA: 1/3 cup (80g) cocoa powder
BSO: 1/4 tsp baking soda
SALT: 1/4 tsp table salt
FOLD: fold in MIX2 FLW COCOA BSO SALT
bake 350* 30-40 minutes FOLD</textarea>
    </section>
    <section>
      <div class="panel-title">SVG</div>
      <div class="result" aria-live="polite">
        <div id="status">Loading renderer…</div>
        <div id="error" role="alert" hidden></div>
        <div id="output" hidden></div>
      </div>
    </section>
  </main>
  <script src="wasm_exec.js"></script>
  <script type="module">
    const source = document.querySelector("#source");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const output = document.querySelector("#output");

    function showError(message) {
      status.hidden = true;
      output.hidden = true;
      error.textContent = message;
      error.hidden = false;
    }

    function render() {
      try {
        const result = globalThis.recipevizRender(source.value);
        if (result.error) {
          showError(result.error);
          return;
        }
        error.hidden = true;
        status.hidden = true;
        output.innerHTML = result.svg;
        output.hidden = false;
      } catch (cause) {
        showError(cause instanceof Error ? cause.message : String(cause));
      }
    }

    source.addEventListener("input", render);

    try {
      const go = new Go();
      const response = await fetch("recipeviz.wasm");
      if (!response.ok) {
        throw new Error(`Loading recipeviz.wasm failed: ${response.status} ${response.statusText}`);
      }
      const { instance } = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
      void go.run(instance);
      for (let attempt = 0; typeof globalThis.recipevizRender !== "function" && attempt < 100; attempt++) {
        await new Promise(resolve => requestAnimationFrame(resolve));
      }
      if (typeof globalThis.recipevizRender !== "function") {
        throw new Error("The WebAssembly renderer did not start.");
      }
      render();
      source.focus();
    } catch (cause) {
      showError(cause instanceof Error ? cause.message : String(cause));
    }
  </script>
</body>
</html>
